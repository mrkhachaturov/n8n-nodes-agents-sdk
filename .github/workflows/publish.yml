name: Publish to npm

# Triggered by pushing a version tag. Bump version in package.json, commit,
# `git tag X.Y.Z`, `git push --follow-tags` — the rest is automatic.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # bare: 0.1.2
      - '[0-9]+.[0-9]+.[0-9]+-*' # bare prerelease: 0.2.0-beta.1
      - 'v[0-9]+.[0-9]+.[0-9]+' # v-prefixed: v0.1.2 (npm version default)
      - 'v[0-9]+.[0-9]+.[0-9]+-*' # v-prefixed prerelease: v0.2.0-beta.1

permissions:
  id-token: write # OIDC for npm Trusted Publisher + provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # RELEASE_MODE=true satisfies the `prepublishOnly` hook (n8n-node
      # prerelease) which otherwise blocks `npm publish`.
      # NPM_CONFIG_PROVENANCE=true requests provenance; works with the
      # Trusted Publisher OIDC token injected via `id-token: write`.
      - run: npm publish --access public
        env:
          RELEASE_MODE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
